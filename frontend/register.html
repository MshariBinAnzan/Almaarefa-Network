<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Almaarefa Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6 bg-slate-50 font-sans antialiased">

  <div class="w-full max-w-md flex justify-between items-center mb-4">
    <a href="login.html" class="text-xs font-semibold text-brand-700 hover:underline">← Back to Sign In</a>
    <div data-theme-switcher></div>
  </div>

  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
    <h1 class="text-2xl font-bold text-slate-900">Create Student Account</h1>
    <p class="text-sm text-slate-500 mt-1 mb-6">Join the verified Almaarefa University campus network</p>

    <div id="reg-error" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs"></div>

    <form id="register-form" class="space-y-4" novalidate>
      <div>
        <label for="fullName" class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
        <input id="fullName" type="text" placeholder="Turki Al-Harbi" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white outline-none focus:border-brand-600" />
      </div>

      <div>
        <label for="studentId" class="block text-xs font-semibold text-slate-700 mb-1">Student ID (7–10 digits)</label>
        <input id="studentId" type="text" placeholder="202110234" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white outline-none focus:border-brand-600" />
      </div>

      <div>
        <label for="departmentId" class="block text-xs font-semibold text-slate-700 mb-1">Academic Department</label>
        <select id="departmentId" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white outline-none focus:border-brand-600"></select>
      </div>

      <div>
        <label for="universityEmail" class="block text-xs font-semibold text-slate-700 mb-1">University Email (@mcst.edu.sa)</label>
        <input id="universityEmail" type="email" placeholder="s123456@mcst.edu.sa" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white outline-none focus:border-brand-600" />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password (min 8 chars)</label>
        <input id="password" type="password" placeholder="••••••••••••" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white outline-none focus:border-brand-600" />
      </div>

      <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-brand-700 hover:bg-brand-800 text-[#ffffff] font-semibold text-sm shadow-sm cursor-pointer">
        Register Student Account
      </button>
    </form>
  </div>

  <script src="js/mocks/data.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/components/theme.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
