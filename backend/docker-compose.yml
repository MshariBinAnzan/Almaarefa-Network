version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: almaarefa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almaarefa_network
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_base_schema.sql:/docker-entrypoint-initdb.d/001_base_schema.sql:ro
      - ./database/migrations/002_complete_platform_schema.sql:/docker-entrypoint-initdb.d/002_complete_platform_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d almaarefa_network']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

